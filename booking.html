<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Book Your Consultation | Get In Canada</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --pad: 80px;
    --form-w: 700px;
    --form-h: 560px;
    --top: 1140px;
    --brand: #d1070f;
  }
  @media (max-width: 800px){
    :root{
      --pad: 40px;
      --form-w: 360px;
      --form-h: 740px;  /* ضع قيمتك المضبوطة هنا */
      --top: 1270px;    /* ضع قيمتك المضبوطة هنا */
    }
  }

  html,body{margin:0;background:#fff}
  body{min-height:100vh;display:flex;flex-direction:column;align-items:center;
       font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
  html[lang="ar"] body{font-family:"Cairo",system-ui,-apple-system,"Segoe UI",Arial,sans-serif}

  /* شريط علوي: رجوع + اللغة */
  .topbar{width:100%;max-width:1040px;box-sizing:border-box;padding:18px 20px 0;
          display:flex;justify-content:space-between;align-items:center}
  .chip{display:inline-flex;align-items:center;justify-content:center;min-width:36px;height:36px;
        padding:0 10px;border:0;border-radius:6px;background:var(--brand);color:#fff;
        font:700 15px/1 inherit;font-family:inherit;cursor:pointer;text-decoration:none}
  .chip svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  [dir="rtl"] .back svg{transform:scaleX(-1)}

  .logo{margin:0;text-align:center}
  .logo img{height:90px;width:auto}

  /* شريط الخطوات: للجوال فقط */
  .steps-wrap{display:none;width:100%;max-width:408px;box-sizing:border-box;padding:0 20px}
  .steps-title{margin:22px 0 14px;text-align:center;font-size:15px;font-weight:700;color:#1f2d3d}
  .steps{list-style:none;margin:0;padding:0;display:flex}
  .steps li{flex:1;position:relative;text-align:center;font-size:12px;line-height:1.35;color:#3a4756}
  .steps li span{
    position:relative;z-index:1;display:flex;align-items:center;justify-content:center;
    width:28px;height:28px;margin:0 auto 6px;border-radius:50%;
    background:var(--brand);color:#fff;font-weight:700;font-size:13px;
  }
  /* الخط الواصل بين الخطوات (من اليسار إلى اليمين) */
  .steps li:not(:last-child)::after{
    content:"";position:absolute;top:13px;inset-inline-start:50%;width:100%;height:2px;background:#f0c4c6;
  }
  @media (max-width: 800px){ .steps-wrap{display:block} }

  .crop{
    position:relative;
    width:min(100%, calc(var(--form-w) + var(--pad) * 2));
    height:calc(var(--form-h) + var(--pad) * 2);
    overflow:hidden;
    display:flex;
    justify-content:center;
  }
  .crop iframe{
    width:var(--form-w);
    flex:none;
    height:3500px;
    margin-top:calc((var(--top) - var(--pad)) * -1);
    border:0;
    display:block;
    opacity:0;
    transition:opacity .5s ease;
  }
  .crop.ready iframe{opacity:1}

  .loader{
    position:absolute;inset:0;background:#fff;
    display:flex;flex-direction:column;align-items:center;
    justify-content:flex-start;padding-top:110px;gap:14px;
    color:#666;font-size:14px;transition:opacity .4s ease;
  }
  .crop.ready .loader{opacity:0;pointer-events:none}
  .spinner{width:36px;height:36px;border:3px solid #eee;
           border-top-color:var(--brand);border-radius:50%;
           animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
  <div class="topbar">
    <a class="chip back" href="index.html" aria-label="Back">
      <svg viewBox="0 0 24 24"><path d="M19 12H5M11 5l-7 7 7 7"/></svg>
    </a>
    <button class="chip" id="langBtn" type="button">EN</button>
  </div>

  <div class="logo">
    <img src="https://booking.getincanada.ca/wp-content/uploads/2023/09/logo-GIC.png" alt="Get In Canada">
  </div>

  <div class="steps-wrap">
    <p class="steps-title" data-t="stepsTitle">Book Your Consultation in 4 Simple Steps</p>
    <ol class="steps">
      <li><span>1</span><em data-t="s1" style="font-style:normal">Service Selection</em></li>
      <li><span>2</span><em data-t="s2" style="font-style:normal">Date &amp; Time</em></li>
      <li><span>3</span><em data-t="s3" style="font-style:normal">Your Information</em></li>
      <li><span>4</span><em data-t="s4" style="font-style:normal">Payments</em></li>
    </ol>
  </div>

  <div class="crop">
    <iframe src="https://booking.getincanada.ca/" scrolling="no"
            title="Booking form" allow="payment"></iframe>
    <div class="loader">
      <div class="spinner"></div>
      <span data-t="loading">Loading booking form…</span>
    </div>
  </div>

<script>
  const SETTLE_MS   = 1500;
  const MAX_WAIT_MS = 9000;
  const crop  = document.querySelector('.crop');
  const frame = crop.querySelector('iframe');
  const show  = () => crop.classList.add('ready');
  frame.addEventListener('load', () => setTimeout(show, SETTLE_MS));
  setTimeout(show, MAX_WAIT_MS);

  /* اللغة: تتزامن مع الصفحة الرئيسية (نموذج الحجز نفسه يبقى بالإنجليزية) */
  const T = {
    ar:{stepsTitle:"احجز استشارتك في 4 خطوات بسيطة",s1:"اختيار الخدمة",s2:"التاريخ والوقت",s3:"معلوماتك",s4:"الدفع",
        loading:"جاري تحميل نموذج الحجز…",btn:"EN",title:"احجز استشارتك | Get In Canada"},
    en:{stepsTitle:"Book Your Consultation in 4 Simple Steps",s1:"Service Selection",s2:"Date & Time",s3:"Your Information",s4:"Payments",
        loading:"Loading booking form…",btn:"ع",title:"Book Your Consultation | Get In Canada"}
  };
  let lang = "ar";
  try{ lang = localStorage.getItem("gic-lang") || "ar"; }catch(e){}
  function applyLang(){
    document.documentElement.lang = lang;
    document.documentElement.dir  = lang === "ar" ? "rtl" : "ltr";
    document.title = T[lang].title;
    document.querySelectorAll("[data-t]").forEach(el => el.textContent = T[lang][el.dataset.t]);
    document.getElementById("langBtn").textContent = T[lang].btn;
  }
  document.getElementById("langBtn").addEventListener("click", () => {
    lang = lang === "ar" ? "en" : "ar";
    try{ localStorage.setItem("gic-lang", lang); }catch(e){}
    applyLang();
  });
  applyLang();
</script>
</body>
</html>
