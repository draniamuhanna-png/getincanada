<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Get In Canada</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#d6000b;
  --brand-dark:#b00009;
  --ink:#1f2d3d;
  --muted:#4a5666;
  --soft:#f1f1f1;
  --card:#fff;
  --radius:12px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{
  background:#fff;color:var(--ink);
  font-family:"Cairo","Inter",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  line-height:1.6;
}
html[lang="en"] body{font-family:"Inter","Cairo",system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer}
svg.i{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
svg.f{fill:currentColor;stroke:none}

.wrap{max-width:480px;margin:0 auto;padding:0 20px 36px}

/* top bar */
.topbar{display:flex;justify-content:space-between;align-items:center;padding:18px 0 0;min-height:60px}
.chip{
  display:inline-flex;align-items:center;justify-content:center;
  flex:none;width:44px;height:36px;padding:0;border:0;border-radius:6px;
  background:var(--brand);color:#fff;font-weight:700;font-size:15px;line-height:1;
}
.chip svg{width:20px;height:20px;font-size:20px}
[dir="rtl"] .back svg{transform:scaleX(-1)}
.back svg{transform:none}
[dir="rtl"] .back svg{transform:none}
/* arrow icon points "left" by default; in RTL flip so it points right (back direction) */
[dir="rtl"] .back svg{transform:scaleX(-1)}

/* views */
.view{display:none}
.view.on{display:block;animation:fade .5s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* hero */
.hero{text-align:center}
.hero img.logo{height:90px;width:auto;margin-top:-40px}
.hero h1{margin:8px 0 8px;font-size:17px;font-weight:800;color:#2b2b2b;line-height:1.5}
.hero h1::after{content:"";display:block;width:48px;height:2px;background:var(--brand);margin:10px auto 0}
.hero p{margin:14px auto 0;font-size:13.5px;color:#333;line-height:1.7}

/* services (بطاقة نشطة أكبر قليلاً، حركة ناعمة وبطيئة) */
.services-wrap{margin-top:20px}
.services{
  display:flex;gap:20px;overflow-x:auto;scroll-snap-type:x mandatory;
  padding:16px 20px 20px;margin:0 -20px;
  scrollbar-width:none;overscroll-behavior-x:contain;
}
.services::-webkit-scrollbar{display:none}
.svc{
  position:relative;flex:0 0 161px;min-height:190px;scroll-snap-align:center;scroll-snap-stop:always;
  background:var(--card);border-radius:10px;padding:18px 28px 18px 20px;text-align:left;
  box-shadow:0 3px 14px rgba(20,30,50,.07);
  transition:background-color .6s ease,box-shadow .6s ease,transform .6s ease;
}
.svc .ico{font-size:34px;color:var(--brand);display:block;margin:0 auto 24px 0;transition:color .6s ease}
.svc h3{margin:0 0 6px;font-size:13.5px;font-weight:700;color:#1b2a3a;transition:color .6s ease}
.svc p{margin:0;font-size:11.5px;line-height:1.8;color:var(--muted);transition:color .6s ease}
.svc.active{background:var(--brand);box-shadow:0 8px 20px rgba(214,0,11,.22);transform:scale(1.11);z-index:1}
.svc.active .ico,.svc.active h3,.svc.active p{color:#fff}
.dots{display:flex;justify-content:center;gap:6px;margin-top:0}
.dots button{width:8px;height:8px;border-radius:50%;border:0;padding:0;background:#d8d8d8;transition:background-color .5s ease}
.dots button.on{background:var(--brand)}

/* CTA */
.cta{
  display:flex;align-items:center;gap:12px;margin-top:22px;
  background:var(--brand);color:#fff;border-radius:8px;padding:16px 18px;
  box-shadow:0 6px 16px rgba(214,0,11,.2);transition:background-color .3s ease;
}
.cta:hover{background:var(--brand-dark)}
.cta .ico{font-size:34px;flex:none}
.cta b{display:block;font-size:22px;font-weight:800;line-height:1.25}
.cta span{display:block;font-size:11px;opacity:.95;margin-top:1px}

/* list buttons */
.grid2{display:grid;gap:8px;margin-top:18px}
.row{
  display:flex;align-items:center;gap:14px;width:100%;
  background:var(--soft);border:0;border-radius:8px;padding:16px 18px;text-align:start;color:inherit;
  transition:background-color .3s ease;
}
.row:hover{background:#e8e8e8}
.row .ico{font-size:32px;color:var(--brand);flex:none}
.row b{display:block;font-size:15.5px;font-weight:700;color:#3a3a3a;line-height:1.3}
.row span{display:block;font-size:12px;color:#555;margin-top:2px}
.row b span{display:inline;margin:0;font-size:inherit;color:inherit}
.row b .brand{color:var(--brand);font-weight:800;direction:ltr;unicode-bidi:isolate}

/* videos */
.vhead{display:flex;align-items:center;gap:14px;margin:26px 0 16px;padding-inline:18px 6px}
.vhead .ico{font-size:32px;color:var(--brand);flex:none}
.vhead h2{margin:0;font-size:15.5px;font-weight:700;color:#3a3a3a;flex:1;line-height:1.3}
.vhead small{font-size:12px;color:#444}
.vgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.reel{
  position:relative;aspect-ratio:9/13.5;border-radius:10px;overflow:hidden;border:0;padding:0;
  background:linear-gradient(160deg,#2a1a3a,#7a0f19 60%,#d6000b);color:#fff;
  box-shadow:0 4px 12px rgba(0,0,0,.15);
}
.reel img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.reel .play{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(to top,rgba(0,0,0,.55),transparent 35%);
}
.reel .play i{
  width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.88);color:var(--brand);
  display:flex;align-items:center;justify-content:center;font-size:15px;font-style:normal;
}
.reel .views{
  position:absolute;bottom:7px;left:8px;display:flex;align-items:center;gap:4px;
  font-size:10.5px;font-weight:600;direction:ltr;line-height:1;
}
.reel .views svg{font-size:12px}
.reel .pin{position:absolute;top:7px;right:7px;font-size:12px;color:#fff}

/* modal: شاشة ريلز منبثقة تحاكي تطبيق إنستغرام، والموقع يظهر من خلفها */
.modal{position:fixed;inset:0;background:rgba(15,20,30,.30);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);display:none;z-index:50;animation:fade .25s ease}
.modal.on{display:block}
.modal .sheet{
  --hdr:60px;   /* ارتفاع رأس تضمين إنستغرام الذي يُخفى (عدّليه إن ظهر جزء منه) */
  --ftr:420px;  /* ارتفاع ذيل التضمين الذي يُخفى (كبير عمداً ليغطي أي حجم) */
  --ratio:515/635; /* نسبة عرض/ارتفاع منطقة الفيديو كما في التصميم المعتمد — عدّليها إن ظهر أو اختفى جزء من الفيديو */
  position:absolute;left:50%;top:50%;
  width:min(440px,calc(100% - 52px));max-height:calc(100vh - 28px);max-height:calc(100dvh - 28px);
  transform:translate(-50%,-50%);background:#0b0f14;border-radius:22px;overflow:hidden;direction:ltr;color:#fff;
  display:flex;flex-direction:column;
  box-shadow:0 18px 60px rgba(0,0,0,.45),0 2px 10px rgba(0,0,0,.2);
  animation:sheetPop .32s ease;
}
.modal .mbar{flex:none;height:52px;display:flex;align-items:center;gap:10px;padding:0 10px 0 14px;background:#ececec;color:#111}
.modal .mbar img{width:34px;height:34px;border-radius:50%;object-fit:contain;background:#fff;flex:none}
.modal .mbar a{font-size:14px;font-weight:600;color:#111;text-decoration:none}
.modal .mbar .dot{color:#111}
.modal .mbar .fol{color:#1f3fd6;font-weight:600}
.modal .mbar .sp{flex:1}
.modal .x{width:34px;height:34px;border:0;border-radius:8px;background:var(--brand);color:#fff;font:700 17px/1 system-ui,sans-serif;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.modal .x:hover{background:var(--brand-dark)}
.modal .stage{position:relative;flex:0 1 auto;width:100%;aspect-ratio:var(--ratio);min-height:0;overflow:hidden;background:#000}
.modal .stage iframe{position:absolute;left:0;top:calc(var(--hdr) * -1);width:100%;height:calc(100% + var(--hdr) + var(--ftr));border:0;background:#000}
.modal .ov{position:absolute;inset:0;pointer-events:none}
.modal .acts{position:absolute;right:0;bottom:6%;width:12.6%;z-index:1;display:flex;flex-direction:column;align-items:center;gap:18px}
.modal .act{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:600}
.modal .act span:empty{display:none}
.modal .act svg{width:28px;height:28px;fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.modal .act.like svg{fill:#ff2d4d;stroke:#ff2d4d}
.modal .cap{position:absolute;left:14px;right:14%;bottom:14px;z-index:1;display:flex;flex-direction:column;gap:8px;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.modal .cap p{margin:0;font-size:12.5px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.modal .cap p:empty{display:none}
.modal .cmt{flex:none;display:block;background:#0b0f14;padding:10px 14px 12px;text-decoration:none}
.modal .cmt span{display:block;background:#1c232b;color:#cfd5dc;border-radius:999px;padding:14px 22px;font-size:14px;text-align:left}
@keyframes sheetPop{from{opacity:0;transform:translate(-50%,-47%)}to{opacity:1;transform:translate(-50%,-50%)}}


/* sub pages */
.sub{max-width:640px;margin:0 auto}
.sub .head{text-align:center;padding:8px 0 26px}
.sub .head img{height:76px;width:76px;object-fit:contain;background:#fff;border:3px solid var(--brand);border-radius:50%;padding:10px;box-shadow:0 8px 22px rgba(0,0,0,.1)}
.sub h2{margin:14px 0 4px;font-size:21px;font-weight:800;color:#2b2b2b}
.sub .head p{margin:0;color:#666;font-size:13px}
.link{
  display:flex;align-items:center;gap:16px;background:#fff;border:1px solid #e3e3e3;border-radius:16px;
  padding:14px 16px;margin-bottom:12px;transition:box-shadow .3s ease;
}
.link:hover{box-shadow:0 6px 16px rgba(0,0,0,.07)}
.link .badge{width:44px;height:44px;border-radius:10px;background:#fdecec;color:var(--brand);display:flex;align-items:center;justify-content:center;font-size:22px;flex:none}
.link b{display:block;font-size:15.5px;font-weight:700}
.link span{display:block;color:#666;font-size:12.5px}
.link .num{direction:ltr;unicode-bidi:embed;display:inline-block}
html[dir="rtl"] .link .num{text-align:right}

/* faq */
.faq-intro{color:#444;font-size:13px;margin:0 0 20px;text-align:center}
.acc{border:0;margin:0 0 10px;border-radius:8px;overflow:hidden}
.acc>button{
  width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;
  background:var(--brand);color:#fff;border:0;padding:13px 16px;text-align:start;font-weight:700;font-size:13.5px;
}
.acc>button i{font-style:normal;font-size:20px;line-height:1;flex:none}
.acc .body{display:none;padding:12px 16px;background:#fafafa;border:1px solid #eee;border-top:0;font-size:13px;color:#333;line-height:1.9}
.acc.open .body{display:block}
.acc .body a{color:var(--brand);text-decoration:underline;font-weight:600}
.faq-end{margin-top:34px;background:#2a4357;border-radius:12px;padding:26px 16px;text-align:center;color:#fff}
.faq-end h3{margin:0 0 6px;font-size:18px}
.faq-end p{margin:0 0 14px;font-weight:700;letter-spacing:.5px}
.faq-end a{display:inline-block;background:#fff;color:var(--ink);border-radius:8px;padding:9px 20px;font-weight:800;font-size:13px}

footer{margin-top:26px;text-align:center;font-size:12px;color:#777}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
footer a{color:var(--brand);font-weight:600}
</style>
</head>

<script>
/* ===== قابل للتعديل ===== */
const SITE = "https://getincanada.ca/";

  ["My application was refused. Can I get a refund?","تم رفض طلبي. هل يمكنني استرداد المبلغ؟"],
  ["What if my relationship status changes, or I have children while my application is in process or after my PR has been granted?","ماذا لو تغيّرت حالتي الاجتماعية أو أنجبت أطفالاً أثناء معالجة طلبي أو بعد حصولي على الإقامة الدائمة؟"],
  ["Who can I include in my application for a Canada Immigration Visa?","من يمكنني إضافته إلى طلب تأشيرة الهجرة إلى كندا؟"],
  ["What does “Lock in date” mean?","ماذا يعني «تاريخ التثبيت» (Lock in date)؟"],
  ["What is an affidavit for a translation?","ما هو إفادة الترجمة (Affidavit)؟"],
  ["How long must I stay in Canada to keep my permanent resident status?","كم يجب أن أقيم في كندا للحفاظ على وضع الإقامة الدائمة؟"],
  ["How can I find a doctor to do my immigration medical exam?","كيف أجد طبيباً لإجراء الفحص الطبي للهجرة؟"],
  ["How long will it take to process my application?","كم تستغرق معالجة طلبي؟"],
  ["What if I can’t get a police certificate for my immigration application?","ماذا لو لم أستطع الحصول على شهادة عدم محكومية لطلب الهجرة؟"]
];
const FAQ_FIRST = {
  ar:`١- يمكنك زيارة قسم <a href="${SITE}" target="_blank" rel="noopener">الهجرة</a> لعرض جميع الخيارات المناسبة لك، سواء كنت ترغب بالهجرة إلى كندا للعمل أو اللجوء أو الدراسة أو الأعمال.<br>٢- يمكنك أيضاً تعبئة <a href="${SITE}" target="_blank" rel="noopener">التقييم المجاني</a> الآن!`,
  en:`1- You can visit our <a href="${SITE}" target="_blank" rel="noopener">IMMIGRATION</a> section to view all of the options that suit you. Whether you want to immigrate to Canada for work, asylum, study, or even business.<br>2- You can also fill out our Free <a href="${SITE}" target="_blank" rel="noopener">ASSESSMENT</a> NOW!`
};

let lang = "ar";
try{ lang = localStorage.getItem("gic-lang") || "ar"; }catch(e){}
const $ = s => document.querySelector(s);

function renderServices(){
  const box = $("#services"); box.innerHTML = "";
  SERVICES.forEach((s,idx)=>{
    const d = document.createElement("article");
    d.className = "svc" + (idx===0 ? " active":"");
    d.innerHTML = `<svg class="i ico"><use href="#${s.i}"/></svg><h3>${s[lang][0]}</h3><p>${s[lang][1]}</p>`;
    d.addEventListener("click",()=>{ setActive(idx); d.scrollIntoView({behavior:"smooth",inline:"center",block:"nearest"}); });
    box.appendChild(d);
  });
  const dots = $("#dots"); dots.innerHTML = "";
  for(let k=0;k<Math.ceil(SERVICES.length/2);k++){
    const b = document.createElement("button");
    b.type="button"; b.setAttribute("aria-label","page "+(k+1));
    b.addEventListener("click",()=>{ const c=box.children[k*2]; c.scrollIntoView({behavior:"smooth",inline:"center",block:"nearest"}); setActive(k*2); });
    dots.appendChild(b);
  }
  setActive(0);
}
function setActive(idx){
  [...$("#services").children].forEach((c,i)=>c.classList.toggle("active",i===idx));
  [...$("#dots").children].forEach((c,i)=>c.classList.toggle("on",i===Math.floor(idx/2)));
}
let scrollT;
$("#services").addEventListener("scroll",()=>{
  clearTimeout(scrollT);
  scrollT=setTimeout(()=>{
    const box=$("#services"), mid=box.getBoundingClientRect().left+box.clientWidth/2;
    let best=0,bd=1e9;
    [...box.children].forEach((c,i)=>{const r=c.getBoundingClientRect();const d=Math.abs(r.left+r.width/2-mid);if(d<bd){bd=d;best=i}});
    setActive(best);
  },120); // لا يتغير اللون إلا بعد استقرار التمرير
},{passive:true});

function renderReels(){
  const g=$("#vgrid"); g.innerHTML="";
  REELS.forEach((r,i)=>{
    const b=document.createElement("button");
    b.type="button"; b.className="reel"; b.setAttribute("aria-label",T[lang].watch+" "+(i+1));
    b.innerHTML=(r.cover?`<img src="${r.cover}" alt="" decoding="async">`:"")+
      `<span class="play"><i><svg class="i"><use href="#play"/></svg></i></span>`+
      (r.pinned?`<svg class="i f pin"><use href="#pin"/></svg>`:"")+
      (r.views?`<span class="views"><svg class="i"><use href="#eye"/></svg>${r.views}</span>`:"");
    b.addEventListener("click",()=>openReel(r.id));
    g.appendChild(b);
  });
}
const ICONS={
  like:'<path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.3 3 4.5 6.6 4.5c2 0 3.5 1 5.4 3 1.9-2 3.4-3 5.4-3 3.6 0 5.7 3.8 4.2 7.3C19.5 16.4 12 21 12 21z"/>',
  comments:'<path d="M12 3a9 9 0 1 0 4.5 16.8L21 21l-1.2-4.5A9 9 0 0 0 12 3z"/>',
  reposts:'<path d="M17 2l4 4-4 4M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4M21 13v2a3 3 0 0 1-3 3H3"/>',
  shares:'<path d="M22 3 9.5 13.5M22 3l-7 18-5.5-7.5L2 9l20-6z"/>',
  saves:'<path d="M6 3h12v18l-6-4.5L6 21z"/>'
};
function openReel(id){
  const r=REELS.find(x=>x.id===id)||{};
  $("#mf").src=`https://www.instagram.com/reel/${id}/embed/`;
  $("#mo").href=`https://www.instagram.com/reel/${id}/`;
  $("#mcap").textContent=r.caption||"";
  $("#macts").innerHTML=[["like","likes"],["comments","comments"],["reposts","reposts"],["shares","shares"],["saves","saves"]]
    .map(([k,f])=>`<div class="act ${k==="like"?"like":""}"><svg viewBox="0 0 24 24">${ICONS[k]}</svg><span>${r[f]||""}</span></div>`).join("");
  $("#modal").classList.add("on"); $("#modal").setAttribute("aria-hidden","false");
  document.body.style.overflow="hidden";
}
function closeReel(){
  $("#modal").classList.remove("on"); $("#modal").setAttribute("aria-hidden","true");
  $("#mf").src="about:blank"; document.body.style.overflow="";
}
$("#mx").addEventListener("click",closeReel);
$("#modal").addEventListener("click",e=>{ if(e.target.id==="modal") closeReel(); });
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeReel(); });

function renderFaq(){
  const a=$("#acc"); a.innerHTML="";
  FAQS.forEach((q,i)=>{
    const d=document.createElement("div"); d.className="acc"+(i===0?" open":"");
    const body = i===0 ? FAQ_FIRST[lang]
      : `${T[lang].more} <a href="${FAQ_PAGE}" target="_blank" rel="noopener">${T[lang].moreLink}</a>.`;
    d.innerHTML=`<button type="button"><span>${q[lang==="ar"?1:0]}</span><i>${i===0?"−":"+"}</i></button><div class="body">${body}</div>`;
    d.querySelector("button").addEventListener("click",()=>{
      const o=d.classList.toggle("open"); d.querySelector("i").textContent=o?"−":"+";
    });
    a.appendChild(d);
  });
}

function applyLang(){
  document.documentElement.lang=lang;
  document.documentElement.dir=lang==="ar"?"rtl":"ltr";
  document.title = lang==="ar" ? "Get In Canada | نحن خطوتك الأولى" : "Get In Canada";
  document.querySelectorAll("[data-i18n]").forEach(el=>{ el.textContent=T[lang][el.dataset.i18n]; });
  $("#langBtn").textContent=T[lang].langBtn;
  renderServices(); renderReels(); renderFaq();
}
$("#langBtn").addEventListener("click",()=>{
  lang = lang==="ar" ? "en" : "ar";
  try{ localStorage.setItem("gic-lang",lang); }catch(e){}
  applyLang();
});

function route(){
  const h=(location.hash||"").replace("#","");
  const id = ["social","faq"].includes(h) ? h : "home";
  document.querySelectorAll(".view").forEach(v=>v.classList.toggle("on",v.id==="v-"+id));
  const back=$("#backBtn");
  if(id==="home"){ back.style.visibility="hidden"; back.removeAttribute("data-inner"); }
  else { back.style.visibility="visible"; back.href="#"; back.setAttribute("data-inner","1"); }
  window.scrollTo(0,0);
}
$("#backBtn").addEventListener("click",e=>{
  if(e.currentTarget.getAttribute("data-inner")){ e.preventDefault(); history.pushState("",document.title,location.pathname+location.search); route(); }
});
window.addEventListener("hashchange",route);

applyLang(); route();
</script>
</body>
</html>
