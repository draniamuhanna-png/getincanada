<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Get In Canada</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#d6000b;
  --brand-dark:#b00009;
  --ink:#1f2d3d;
  --muted:#4a5666;
  --soft:#f1f1f1;
  --card:#fff;
  --radius:12px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{
  background:#fff;color:var(--ink);
  font-family:"Cairo","Inter",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  line-height:1.6;
}
html[lang="en"] body{font-family:"Inter","Cairo",system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer}
svg.i{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
svg.f{fill:currentColor;stroke:none}

.wrap{max-width:1040px;margin:0 auto;padding:0 20px 40px}

/* top bar */
.topbar{display:flex;justify-content:space-between;align-items:center;padding:18px 0 0;min-height:60px}
.chip{
  display:inline-flex;align-items:center;justify-content:center;
  min-width:36px;height:36px;padding:0 10px;border:0;border-radius:6px;
  background:var(--brand);color:#fff;font-weight:700;font-size:15px;
}
.chip svg{font-size:20px}
[dir="rtl"] .back svg{transform:scaleX(-1)}
.back svg{transform:none}
[dir="rtl"] .back svg{transform:none}
/* arrow icon points "left" by default; in RTL flip so it points right (back direction) */
[dir="rtl"] .back svg{transform:scaleX(-1)}

/* views */
.view{display:none}
.view.on{display:block;animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* hero */
.hero{text-align:center}
.hero img.logo{height:120px;width:auto;margin-top:-18px}
.hero h1{margin:14px 0 10px;font-size:26px;font-weight:800;color:#2b2b2b}
.hero h1::after{content:"";display:block;width:64px;height:2px;background:var(--brand);margin:12px auto 0}
.hero p{margin:18px auto 0;max-width:640px;font-size:16px;color:#333;line-height:1.95}

/* services */
.services-wrap{margin-top:34px}
.services{
  display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;
  padding:14px 4px 20px;margin:0 -20px;padding-inline:20px;
  scrollbar-width:none;
}
.services::-webkit-scrollbar{display:none}
.svc{
  flex:0 0 210px;scroll-snap-align:center;
  background:var(--card);border-radius:var(--radius);padding:24px 22px 26px;
  box-shadow:0 4px 18px rgba(20,30,50,.07);
  transition:background .25s,color .25s,transform .25s,box-shadow .25s;
  min-height:248px;
}
.svc .ico{font-size:40px;color:var(--brand);display:block;margin-bottom:18px;transition:color .25s}
.svc h3{margin:0 0 8px;font-size:17px;font-weight:700;color:#1b2a3a;transition:color .25s}
.svc p{margin:0;font-size:13px;line-height:1.75;color:var(--muted);transition:color .25s}
.svc.active{background:var(--brand);box-shadow:0 10px 26px rgba(214,0,11,.3);transform:translateY(-4px)}
.svc.active .ico,.svc.active h3,.svc.active p{color:#fff}
.dots{display:flex;justify-content:center;gap:8px;margin-top:2px}
.dots button{width:11px;height:11px;border-radius:50%;border:0;padding:0;background:#d8d8d8}
.dots button.on{background:var(--brand)}

@media (min-width:900px){
  .services{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;overflow:visible;margin:0;padding:10px 0 20px}
  .svc{flex:none;min-height:230px}
  .svc:hover{background:var(--brand);box-shadow:0 10px 26px rgba(214,0,11,.3);transform:translateY(-4px)}
  .svc:hover .ico,.svc:hover h3,.svc:hover p{color:#fff}
  .svc.active:not(:hover){background:var(--card);box-shadow:0 4px 18px rgba(20,30,50,.07);transform:none}
  .svc.active:not(:hover) .ico{color:var(--brand)}
  .svc.active:not(:hover) h3{color:#1b2a3a}
  .svc.active:not(:hover) p{color:var(--muted)}
  .dots{display:none}
}

/* CTA */
.cta{
  display:flex;align-items:center;gap:18px;margin-top:18px;
  background:var(--brand);color:#fff;border-radius:10px;padding:22px 24px;
  box-shadow:0 8px 22px rgba(214,0,11,.25);transition:background .2s,transform .2s;
}
.cta:hover{background:var(--brand-dark);transform:translateY(-2px)}
.cta .ico{font-size:54px;flex:none}
.cta b{display:block;font-size:30px;font-weight:800;line-height:1.25}
.cta span{display:block;font-size:15px;opacity:.95;margin-top:2px}
@media (max-width:600px){.cta b{font-size:24px}.cta .ico{font-size:46px}.cta{padding:20px}}

/* list buttons */
.grid2{display:grid;gap:16px;margin-top:22px}
@media (min-width:760px){.grid2{grid-template-columns:1fr 1fr}}
.row{
  display:flex;align-items:center;gap:18px;width:100%;
  background:var(--soft);border:0;border-radius:10px;padding:20px 24px;text-align:start;color:inherit;
  transition:background .2s,transform .2s;
}
.row:hover{background:#e8e8e8;transform:translateY(-2px)}
.row .ico{font-size:40px;color:var(--brand);flex:none}
.row b{display:block;font-size:22px;font-weight:700;color:#3a3a3a;line-height:1.3}
.row span{display:block;font-size:15px;color:#555;margin-top:2px}

/* videos */
.vhead{display:flex;align-items:center;gap:14px;margin:42px 0 18px}
.vhead .ico{font-size:38px;color:var(--brand)}
.vhead h2{margin:0;font-size:23px;font-weight:700;color:#3a3a3a;flex:1}
.vhead small{font-size:14px;color:#444}
.vgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media (min-width:760px){.vgrid{gap:22px;max-width:760px;margin:0 auto}}
.reel{
  position:relative;aspect-ratio:9/13.2;border-radius:12px;overflow:hidden;border:0;padding:0;
  background:linear-gradient(160deg,#2a1a3a,#7a0f19 60%,#d6000b);color:#fff;
  box-shadow:0 6px 18px rgba(0,0,0,.18);transition:transform .2s;
}
.reel:hover{transform:translateY(-3px)}
.reel img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.reel .play{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(to top,rgba(0,0,0,.5),transparent 55%);
}
.reel .play i{
  width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,.92);color:var(--brand);
  display:flex;align-items:center;justify-content:center;font-size:24px;font-style:normal;
}
.reel .views{position:absolute;bottom:8px;inset-inline-start:10px;font-size:12px;font-weight:600;direction:ltr}

/* modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal.on{display:flex}
.modal .box{position:relative;width:min(420px,100%);height:min(86vh,760px);background:#fff;border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.modal iframe{flex:1;border:0;width:100%}
.modal .x{position:absolute;top:8px;inset-inline-end:8px;z-index:2;width:36px;height:36px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;font-size:18px;display:flex;align-items:center;justify-content:center}
.modal .open{display:block;text-align:center;padding:11px;font-size:14px;font-weight:700;color:var(--brand);background:#fafafa;border-top:1px solid #eee}

/* sub pages */
.sub{max-width:640px;margin:0 auto}
.sub .head{text-align:center;padding:8px 0 26px}
.sub .head img{height:92px;width:92px;object-fit:contain;background:#fff;border:3px solid var(--brand);border-radius:50%;padding:10px;box-shadow:0 8px 22px rgba(0,0,0,.1)}
.sub h2{margin:16px 0 4px;font-size:28px;font-weight:800;color:#2b2b2b}
.sub .head p{margin:0;color:#666}
.link{
  display:flex;align-items:center;gap:16px;background:#fff;border:1px solid #e3e3e3;border-radius:16px;
  padding:18px 20px;margin-bottom:14px;transition:box-shadow .2s,transform .2s;
}
.link:hover{box-shadow:0 8px 20px rgba(0,0,0,.08);transform:translateY(-2px)}
.link .badge{width:52px;height:52px;border-radius:12px;background:#fdecec;color:var(--brand);display:flex;align-items:center;justify-content:center;font-size:26px;flex:none}
.link b{display:block;font-size:19px;font-weight:700}
.link span{display:block;color:#666;font-size:14px}
.link .num{direction:ltr;unicode-bidi:embed;display:inline-block}
html[dir="rtl"] .link .num{text-align:right}

/* faq */
.faq-intro{color:#444;font-size:15px;margin:0 0 20px;text-align:center}
.acc{border:0;margin:0 0 10px;border-radius:8px;overflow:hidden}
.acc>button{
  width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;
  background:var(--brand);color:#fff;border:0;padding:15px 18px;text-align:start;font-weight:700;font-size:15px;
}
.acc>button i{font-style:normal;font-size:22px;line-height:1;flex:none}
.acc .body{display:none;padding:14px 18px;background:#fafafa;border:1px solid #eee;border-top:0;font-size:14.5px;color:#333;line-height:1.9}
.acc.open .body{display:block}
.acc .body a{color:var(--brand);text-decoration:underline;font-weight:600}
.faq-end{margin-top:34px;background:#2a4357;border-radius:12px;padding:26px 16px;text-align:center;color:#fff}
.faq-end h3{margin:0 0 6px;font-size:22px}
.faq-end p{margin:0 0 14px;font-weight:700;letter-spacing:.5px}
.faq-end a{display:inline-block;background:#fff;color:var(--ink);border-radius:8px;padding:10px 22px;font-weight:800;font-size:14px}

footer{margin-top:34px;text-align:center;font-size:13px;color:#777}
footer a{color:var(--brand);font-weight:600}
</style>
</head>

];

const FAQS = [
  ["What immigration programs can I apply for?","ما هي برامج الهجرة التي يمكنني التقديم عليها؟"],
  ["My application was refused. Can I get a refund?","تم رفض طلبي. هل يمكنني استرداد المبلغ؟"],
  ["What if my relationship status changes, or I have children while my application is in process or after my PR has been granted?","ماذا لو تغيّرت حالتي الاجتماعية أو أنجبت أطفالاً أثناء معالجة طلبي أو بعد حصولي على الإقامة الدائمة؟"],
  ["Who can I include in my application for a Canada Immigration Visa?","من يمكنني إضافته إلى طلب تأشيرة الهجرة إلى كندا؟"],
  ["What does “Lock in date” mean?","ماذا يعني «تاريخ التثبيت» (Lock in date)؟"],
  ["What is an affidavit for a translation?","ما هو إفادة الترجمة (Affidavit)؟"],
  ["How long must I stay in Canada to keep my permanent resident status?","كم يجب أن أقيم في كندا للحفاظ على وضع الإقامة الدائمة؟"],
  ["How can I find a doctor to do my immigration medical exam?","كيف أجد طبيباً لإجراء الفحص الطبي للهجرة؟"],
  ["How long will it take to process my application?","كم تستغرق معالجة طلبي؟"],
  ["What if I can’t get a police certificate for my immigration application?","ماذا لو لم أستطع الحصول على شهادة عدم محكومية لطلب الهجرة؟"]
];
const FAQ_FIRST = {
  ar:`١- يمكنك زيارة قسم <a href="${SITE}" target="_blank" rel="noopener">الهجرة</a> لعرض جميع الخيارات المناسبة لك، سواء كنت ترغب بالهجرة إلى كندا للعمل أو اللجوء أو الدراسة أو الأعمال.<br>٢- يمكنك أيضاً تعبئة <a href="${SITE}" target="_blank" rel="noopener">التقييم المجاني</a> الآن!`,
  en:`1- You can visit our <a href="${SITE}" target="_blank" rel="noopener">IMMIGRATION</a> section to view all of the options that suit you. Whether you want to immigrate to Canada for work, asylum, study, or even business.<br>2- You can also fill out our Free <a href="${SITE}" target="_blank" rel="noopener">ASSESSMENT</a> NOW!`
};

let lang = "ar";
try{ lang = localStorage.getItem("gic-lang") || "ar"; }catch(e){}
const $ = s => document.querySelector(s);

function renderServices(){
  const box = $("#services"); box.innerHTML = "";
  SERVICES.forEach((s,idx)=>{
    const d = document.createElement("article");
    d.className = "svc" + (idx===0 ? " active":"");
    d.innerHTML = `<svg class="i ico"><use href="#${s.i}"/></svg><h3>${s[lang][0]}</h3><p>${s[lang][1]}</p>`;
    d.addEventListener("click",()=>{ setActive(idx); d.scrollIntoView({behavior:"smooth",inline:"center",block:"nearest"}); });
    box.appendChild(d);
  });
  const dots = $("#dots"); dots.innerHTML = "";
  for(let k=0;k<Math.ceil(SERVICES.length/2);k++){
    const b = document.createElement("button");
    b.type="button"; b.setAttribute("aria-label","page "+(k+1));
    b.addEventListener("click",()=>{ const c=box.children[k*2]; c.scrollIntoView({behavior:"smooth",inline:"center",block:"nearest"}); setActive(k*2); });
    dots.appendChild(b);
  }
  setActive(0);
}
function setActive(idx){
  [...$("#services").children].forEach((c,i)=>c.classList.toggle("active",i===idx));
  [...$("#dots").children].forEach((c,i)=>c.classList.toggle("on",i===Math.floor(idx/2)));
}
$("#services").addEventListener("scroll",()=>{
  if(window.innerWidth>=900) return;
  const box=$("#services"), mid=box.getBoundingClientRect().left+box.clientWidth/2;
  let best=0,bd=1e9;
  [...box.children].forEach((c,i)=>{const r=c.getBoundingClientRect();const d=Math.abs(r.left+r.width/2-mid);if(d<bd){bd=d;best=i}});
  setActive(best);
},{passive:true});

function renderReels(){
  const g=$("#vgrid"); g.innerHTML="";
  REELS.forEach((r,i)=>{
    const b=document.createElement("button");
    b.type="button"; b.className="reel"; b.setAttribute("aria-label",T[lang].watch+" "+(i+1));
    b.innerHTML=(r.cover?`<img src="${r.cover}" alt="" loading="lazy">`:"")+
      `<span class="play"><i><svg class="i"><use href="#play"/></svg></i></span>`+
      (r.views?`<span class="views">👁 ${r.views}</span>`:"");
    b.addEventListener("click",()=>openReel(r.id));
    g.appendChild(b);
  });
}
function openReel(id){
  $("#mf").src=`https://www.instagram.com/reel/${id}/embed/`;
  $("#mo").href=`https://www.instagram.com/reel/${id}/`;
  $("#modal").classList.add("on"); $("#modal").setAttribute("aria-hidden","false");
  document.body.style.overflow="hidden";
}
function closeReel(){
  $("#modal").classList.remove("on"); $("#modal").setAttribute("aria-hidden","true");
  $("#mf").src="about:blank"; document.body.style.overflow="";
}
$("#mx").addEventListener("click",closeReel);
$("#modal").addEventListener("click",e=>{ if(e.target.id==="modal") closeReel(); });
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeReel(); });

function renderFaq(){
  const a=$("#acc"); a.innerHTML="";
  FAQS.forEach((q,i)=>{
    const d=document.createElement("div"); d.className="acc"+(i===0?" open":"");
    const body = i===0 ? FAQ_FIRST[lang]
      : `${T[lang].more} <a href="${FAQ_PAGE}" target="_blank" rel="noopener">${T[lang].moreLink}</a>.`;
    d.innerHTML=`<button type="button"><span>${q[lang==="ar"?1:0]}</span><i>${i===0?"−":"+"}</i></button><div class="body">${body}</div>`;
    d.querySelector("button").addEventListener("click",()=>{
      const o=d.classList.toggle("open"); d.querySelector("i").textContent=o?"−":"+";
    });
    a.appendChild(d);
  });
}

function applyLang(){
  document.documentElement.lang=lang;
  document.documentElement.dir=lang==="ar"?"rtl":"ltr";
  document.title = lang==="ar" ? "Get In Canada | نحن خطوتك الأولى" : "Get In Canada";
  document.querySelectorAll("[data-i18n]").forEach(el=>{ el.textContent=T[lang][el.dataset.i18n]; });
  $("#langBtn").textContent=T[lang].langBtn;
  renderServices(); renderReels(); renderFaq();
}
$("#langBtn").addEventListener("click",()=>{
  lang = lang==="ar" ? "en" : "ar";
  try{ localStorage.setItem("gic-lang",lang); }catch(e){}
  applyLang();
});

function route(){
  const h=(location.hash||"").replace("#","");
  const id = ["social","faq"].includes(h) ? h : "home";
  document.querySelectorAll(".view").forEach(v=>v.classList.toggle("on",v.id==="v-"+id));
  const back=$("#backBtn");
  if(id==="home"){ back.style.visibility="hidden"; back.removeAttribute("data-inner"); }
  else { back.style.visibility="visible"; back.href="#"; back.setAttribute("data-inner","1"); }
  window.scrollTo(0,0);
}
$("#backBtn").addEventListener("click",e=>{
  if(e.currentTarget.getAttribute("data-inner")){ e.preventDefault(); history.pushState("",document.title,location.pathname+location.search); route(); }
});
window.addEventListener("hashchange",route);

applyLang(); route();
</script>
</body>
</html>
